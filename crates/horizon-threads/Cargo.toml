[package]
name = "horizon-threads"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Scheduling hints for the game's threads: the OS calls the crates that forbid unsafe code can't make"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm_thread = "=0.3.3"

# The 64-bit browser build has no ready-made getrandom backend: see "wasm64_random" in src/lib.rs.
[target.'cfg(target_arch = "wasm64")'.dependencies]
getrandom = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[lints]
workspace = true
