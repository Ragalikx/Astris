name: Deploy

# Builds the engine (wasm32 and wasm64) and uploads the site to Cloudflare Pages.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  TOOLCHAIN: nightly-2026-10-29
  WASM_BINDGEN: 0.2.129
  BINARYEN: version_133
  PROJECT: astris

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install $TOOLCHAIN --profile minimal --component rust-src
          rustup default $TOOLCHAIN
          # build.ps1 asks for `+nightly`, so the pinned one answers to that name too.
          rustup toolchain link nightly "$(rustc --print sysroot)"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: wasm-${{ env.TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasm-${{ env.TOOLCHAIN }}-

      - name: wasm-bindgen and Binaryen
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$WASM_BINDGEN"; then
            cargo install wasm-bindgen-cli --version $WASM_BINDGEN --locked --force
          fi
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-x86_64-linux.tar.gz | tar xz -C $RUNNER_TEMP
          echo "WASM_OPT=$RUNNER_TEMP/binaryen-$BINARYEN/bin/wasm-opt" >> $GITHUB_ENV

      - name: Build wasm32
        shell: pwsh
        run: ./web/build.ps1 -Release -CpuShare 1

      - name: Build wasm64
        shell: pwsh
        run: ./web/build.ps1 -Release -Wasm64 -CpuShare 1

      - name: Site
        run: python3 tools/build-site.py

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name $PROJECT --branch main --commit-dirty=true
