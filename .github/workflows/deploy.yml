name: Deploy

# Builds the engine (wasm32 and wasm64, side by side) and uploads the site to Cloudflare Pages.
# An engine is rebuilt only when its sources change: otherwise the last build is reused and
# a push that touches only web/ deploys in a minute or two.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A running build is let finish (so its engine lands in the cache); pushes made meanwhile
# collapse into one run that starts after it.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TOOLCHAIN: nightly-2026-10-29
  RUST_TOOLCHAIN: nightly-2026-10-29
  # wasm-bindgen from git: threads on memory64 (wasm64) landed after the 0.2.129 release,
  # and this commit still speaks 0.2.129, the version Cargo.lock pins.
  WASM_BINDGEN_REV: add691ae7cccf88a00dc4bb66c4b50b406d014f6
  BINARYEN: version_133
  PROJECT: astris

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # wasm64 is experimental: if it fails, the site still goes out with wasm32 alone.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: wasm32, out: pkg, flags: '', optional: false}
          - {name: wasm64, out: pkg64, flags: '-Wasm64', optional: true}
    steps:
      - uses: actions/checkout@v4

      # The finished engine, keyed by everything that goes into it.
      - id: built
        uses: actions/cache@v4
        with:
          path: web/${{ matrix.out }}
          key: engine-${{ matrix.name }}-${{ env.TOOLCHAIN }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'web/build.ps1') }}

      - name: Rust
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install $TOOLCHAIN --profile minimal --component rust-src
          rustup default $TOOLCHAIN

      - if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen.rev
            target
          key: cargo-${{ matrix.name }}-${{ env.TOOLCHAIN }}-${{ env.WASM_BINDGEN_REV }}-src-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.name }}-${{ env.TOOLCHAIN }}-${{ env.WASM_BINDGEN_REV }}-src-

      - name: wasm-bindgen and Binaryen
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          if [ "$(cat ~/.cargo/bin/wasm-bindgen.rev 2>/dev/null)" != "$WASM_BINDGEN_REV" ]; then
            # From the source archive, not a git checkout: built in a checkout, wasm-bindgen adds
            # the commit to its schema version ("0.2.129 (add691ae7)") and then refuses the
            # crate's plain "0.2.129".
            curl -sL https://github.com/wasm-bindgen/wasm-bindgen/archive/$WASM_BINDGEN_REV.tar.gz | tar xz -C $RUNNER_TEMP
            GIT_DIR=/nonexistent cargo install --path $RUNNER_TEMP/wasm-bindgen-$WASM_BINDGEN_REV/crates/cli --locked --force
            echo "$WASM_BINDGEN_REV" > ~/.cargo/bin/wasm-bindgen.rev
          fi
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-x86_64-linux.tar.gz | tar xz -C $RUNNER_TEMP
          echo "WASM_OPT=$RUNNER_TEMP/binaryen-$BINARYEN/bin/wasm-opt" >> $GITHUB_ENV

      - name: Build
        if: steps.built.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./web/build.ps1 -Release ${{ matrix.flags }} -CpuShare 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: web/${{ matrix.out }}
          retention-days: 1

  deploy:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: web

      - name: Site
        run: python3 tools/build-site.py

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name $PROJECT --branch main --commit-dirty=true
